name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that module.json version matches the tag
        run: |
          VERSION=$(jq -r .version module.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::module.json version ($VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Point manifest and download at this release
        run: |
          jq --arg m "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json" \
             --arg d "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/module.zip" \
             '.manifest = $m | .download = $d' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip . -x ".git/*" ".github/*" ".gitignore" ".gitattributes"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
